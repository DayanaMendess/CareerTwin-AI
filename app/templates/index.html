
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerTwin AI - Perfil Profesional</title>

    <!-- Conexión CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <!-- Conexión JavaScript -->
    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</head>

<body>
    <main class="container">

        <header>
            <span class="badge">Inteligencia artificial</span>
            <h1>CareerTwin AI</h1>
            <p>
                Descubre nuevas oportunidades profesionales.
                Registra tu perfil y tus objetivos laborales.
            </p>
        </header>

        <section class="form-section">
            <h2>Mi perfil profesional</h2>
            <p>Completa la siguiente información:</p>

            <form id="profileForm">

                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre"
                       placeholder="Escribe tu nombre" required>

                <label for="perfil">Perfil profesional</label>
                <textarea id="perfil" name="perfil"
                          placeholder="Describe tu formación y experiencia"
                          required></textarea>

                <label for="habilidades">Habilidades</label>
                <textarea id="habilidades" name="habilidades"
                          placeholder="Ejemplo: Python, SQL, comunicación"
                          required></textarea>

                <label for="objetivo">Objetivo laboral</label>
                <select id="objetivo" name="objetivo" required>
                    <option value="">Selecciona tu objetivo</option>
                    <option value="Conseguir empleo">Conseguir empleo</option>
                    <option value="Mejorar profesionalmente">Mejorar profesionalmente</option>
                    <option value="Cambiar de carrera">Cambiar de carrera</option>
                    <option value="Realizar prácticas">Realizar prácticas</option>
                </select>

                <button type="submit" id="btnAnalizar">
                    Analizar mi perfil
                </button>

            </form>

            <div id="resultado" hidden aria-live="polite"></div>
        </section>

        <footer>
            <p>CareerTwin AI | Proyecto académico</p>
        </footer>

    </main>
</body>
</html>
